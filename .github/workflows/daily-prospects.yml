name: Daily prospect scan

on:
  schedule:
    # 9h00 heure du Japon (UTC+9, pas de changement d'heure) = minuit UTC
    - cron: "0 0,6,12 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Mode démo (poste un exemple fictif sur Discord, sans appeler l'API Meta)"
        type: boolean
        default: false

permissions:
  contents: write   # nécessaire pour committer seen_pages.json

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run prospect bot
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          DEMO_MODE: ${{ github.event.inputs.demo == 'true' && '1' || '0' }}
        run: python -u prospect_bot.py

      - name: Commit seen_pages.json
        run: |
          git config user.name "prospect-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_pages.json
          git diff --staged --quiet || git commit -m "update seen prospects"
          git push
